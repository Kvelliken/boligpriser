name: Verifiser datakilder

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kjør verifisering
        env:
          PYTHONPATH: src
        run: python -m boligprognose.verify --out verify-report.md
      - name: Vis rapport i jobbsammendraget
        if: always()
        run: cat verify-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verify-report
          path: verify-report.md
